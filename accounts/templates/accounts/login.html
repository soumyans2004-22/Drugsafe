<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DrugSafe</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #f4f8fc;
            color: #163b63;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            height: 92px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 6%;
            box-shadow: 0 2px 12px rgba(0, 60, 120, 0.08);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, #0878d9, #35a7e8);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 120, 220, 0.25);
        }

        .brand h1 {
            font-size: 26px;
            color: #174a7c;
        }

        .brand p {
            font-size: 12px;
            color: #6d8ba8;
            margin-top: 3px;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #47647f;
            font-weight: 600;
            font-size: 16px;
        }

        .nav-links a:hover,
        .nav-links .active {
            color: #0878d9;
        }

        /* MAIN */

        .container {
            min-height: calc(100vh - 167px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 55px 20px;
        }

        .login-card {
            width: 430px;
            background: white;
            padding: 42px;
            border-radius: 22px;
            box-shadow: 0 12px 35px rgba(23, 74, 124, 0.12);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 16px;
            background: #e5f2ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-title h2 {
            font-size: 32px;
            color: #174a7c;
            margin-bottom: 8px;
        }

        .login-title p {
            color: #7088a0;
            font-size: 15px;
        }

        /* FORM */

        label {
            display: block;
            margin-bottom: 8px;
            color: #174a7c;
            font-weight: 600;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d5e3ef;
            border-radius: 10px;
            background: #f8fbfe;
            color: #174a7c;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #0878d9;
            background: white;
            box-shadow: 0 0 0 3px rgba(8, 120, 217, 0.08);
        }

        /* BUTTON */

        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #0878d9, #1269b0);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0, 120, 220, 0.20);
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 9px 20px rgba(0, 120, 220, 0.28);
        }

        /* ERROR */

        .error {
            background: #fff0f0;
            color: #c0392b;
            border: 1px solid #ffd6d6;
            padding: 11px;
            border-radius: 9px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }

        /* REGISTER */

        .register-link {
            text-align: center;
            margin-top: 25px;
            color: #7088a0;
            font-size: 14px;
        }

        .register-link a {
            color: #0878d9;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* FOOTER */

        footer {
            background: white;
            border-top: 1px solid #e2ebf3;
            text-align: center;
            padding: 25px;
            color: #7088a0;
            font-size: 14px;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            header {
                height: auto;
                padding: 18px 5%;
                flex-direction: column;
                gap: 18px;
            }

            .nav-links {
                gap: 18px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .login-card {
                width: 100%;
                max-width: 430px;
                padding: 30px 25px;
            }

            .login-title h2 {
                font-size: 28px;
            }

        }

    </style>

</head>

<body>

<!-- HEADER -->

<header>

    <div class="logo-area">

        <div class="logo">
            DS
        </div>

        <div class="brand">

            <h1>DrugSafe</h1>

            <p>
                Safer Medications. Smarter Insights.
            </p>

        </div>

    </div>


    <nav class="nav-links">

        <a href="/">
            Home
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    </nav>

</header>


<!-- LOGIN -->

<main class="container">

    <div class="login-card">

        <div class="login-icon">
            🔐
        </div>

        <div class="login-title">

            <h2>Welcome Back</h2>

            <p>
                Login to your DrugSafe account
            </p>

        </div>


        {% if error %}

            <div class="error">
                {{ error }}
            </div>

        {% endif %}


        <form method="POST" autocomplete="off">

            {% csrf_token %}


            <div class="input-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="off"
                    value=""
                    required
                >

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="new-password"
                    value=""
                    required
                >

            </div>


            <button type="submit">
                Login to DrugSafe
            </button>

        </form>


        <div class="register-link">

            Don't have an account?

            <a href="{% url 'register' %}">
                Create an Account
            </a>

        </div>

    </div>

</main>


<!-- FOOTER -->

<footer>

    DrugSafe © 2026 | AI-powered medicinal drug interaction analysis

</footer>


<script>

    function clearLoginFields() {

        document.getElementById("email").value = "";
        document.getElementById("password").value = "";

    }

    window.addEventListener("load", clearLoginFields);

    window.addEventListener("pageshow", clearLoginFields);

</script>

</body>

</html>
